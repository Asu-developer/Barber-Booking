<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Girişi</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>
            Admin Paneli
        </h1>


        {% if error %}

        <div class="login-error">

            {{ error }}

        </div>

        {% endif %}


        <form
            method="POST"
        >

            <label>
                Kullanıcı Adı
            </label>

            <input
                type="text"
                name="username"
                required
            >


            <label>
                Şifre
            </label>

            <input
                type="password"
                name="password"
                required
            >


            <button type="submit">

                Giriş Yap

            </button>

        </form>


        <a
            href="/"
            class="login-back"
        >
            Ana Sayfaya Dön
        </a>

    </div>

</div>

</body>

</html>
